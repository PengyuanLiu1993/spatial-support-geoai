[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-support-geoai"
version = "1.0.0"
description = "Spatial support validation and HFGE accessibility experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
geo = [
  "geopandas>=1.0", "networkx>=3.3", "osmium>=4.0", "pyarrow>=17",
  "pyproj>=3.6", "shapely>=2.0", "requests>=2.32",
  "planetary-computer>=1.0", "pystac-client>=0.9", "rasterio>=1.4",
]
analysis = ["esda>=2.6", "libpysal>=4.12", "matplotlib>=3.9"]
tabpfn = ["tabpfn>=8.2,<9"]
figures = ["lxml>=5", "pypdf>=5", "reportlab>=4", "pypdfium2>=4"]

[project.scripts]
gravity-gnn = "gravity_gnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = ["external_data: requires separately downloaded geographical inputs"]
